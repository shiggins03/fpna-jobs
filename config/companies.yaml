# Direct-monitor roster. Direct employer listings are the product — see
# CLAUDE.md rule 4.
#
# tier   = comp/prestige band for a senior finance career. A = top-of-market
#          tech comp (base + meaningful equity), B = large established firms
#          with solid but not top-of-band comp, C = everything else.
#          Tier leads the sort inside each fit band.
# category = bigtech | tech | advertising — drives the card badge and answers
#          the owner's "Big Tech" vs "Advertising" split without duplicating
#          jobs into separate sections.
# ats    = workday | greenhouse | smartrecruiters | amazon_jobs | meta_graphql
#          | oracle_orc | google_careers | successfactors | phenom | avature_feed
# enabled: true  = endpoint shape proven (either reused from unifier-jobs where
#          it was live-verified, or verified here by a probe run)
#          false = needs fingerprinting; see the note. Nothing is silently
#          dropped — disabled companies still show greyed on the dashboard.
# search_queries: optional per-company override of keywords.yaml `queries`
#          (use when an ATS search is fuzzy or the default set returns junk).
companies:
  # ---------------- Tier A / big tech ----------------
  - name: Amazon
    tier: A
    category: bigtech
    ats: amazon_jobs
    # See the comment in fetch_amazon_jobs: the unscoped pass is dominated by
    # Seattle/Bellevue for every finance query, so a New York-scoped pass runs
    # alongside it. Both passes are merged on URL.
    loc_queries: ["New York", null]
    enabled: true
    note: public search.json, full-text over the posting body; endpoint reused
      from unifier-jobs where it was live-verified 2026-07-30. Amazon's NYC
      finance org (Ads, Prime Video, Devices) is the densest single source of
      in-range Finance Manager / Sr Finance Manager roles on this roster.
  - name: Meta
    tier: A
    category: bigtech
    ats: meta_graphql
    doc_id: "27807005005556827"
    enabled: true
    note: graphql CPJobSearchSourceQuery; doc_id + request shape reused from
      unifier-jobs (captured 2026-07-17, long-lived but can rotate — a rotation
      shows up as a fail_streak health warning, not silent zeroes).
  - name: Google
    tier: A
    category: bigtech
    ats: google_careers
    url: https://careers.google.com/api/v3/search/?q={query}&location=New%20York%2C%20NY
    enabled: false
    note: >-
      unifier-jobs monitored Google via a generic_page keyword check, which is
      useless here (every careers page contains the word "finance"). Probe
      round 1 (2026-08-10) ruled out both v3 search shapes: careers.google.com
      /api/v3/search returned 404 JSON and the www.google.com/about/careers
      /applications/api/v3/search path returned a 404 HTML page. Needs a fresh
      capture of what the live careers UI actually calls (browser XHR sniff,
      the technique that cracked Meta in unifier-jobs).
  - name: NVIDIA
    tier: A
    category: bigtech
    ats: workday
    workday_host: nvidia.wd5.myworkdayjobs.com
    workday_tenant: nvidia
    workday_site: NVIDIAExternalCareerSite
    enabled: true
    note: cxs endpoint reused from unifier-jobs (verified 2026-07-30,
      inventory 2000). Workday searchText is fuzzy — expect unrelated hits that
      the function/seniority gates drop. That is noise, not breakage.
  - name: Adobe
    tier: A
    category: bigtech
    ats: workday
    workday_host: adobe.wd5.myworkdayjobs.com
    workday_tenant: adobe
    workday_site: external_experienced
    enabled: true
    note: cxs verified by probe round 1 on 2026-08-10 (200, inventory 801). The
      AdobeCareers site name is a 404 — external_experienced is the right one.
  - name: Salesforce
    tier: A
    category: bigtech
    ats: workday
    workday_host: salesforce.wd12.myworkdayjobs.com
    workday_tenant: salesforce
    workday_site: External_Career_Site
    enabled: true
    note: cxs verified by probe round 1 on 2026-08-10 (200, inventory 1467).
      Host matters — wd12 works, wd1 answers 422 for the same tenant/site.
  - name: Intuit
    tier: A
    category: bigtech
    ats: workday
    workday_host: intuit.wd1.myworkdayjobs.com
    workday_tenant: intuit
    workday_site: intuitcareers
    enabled: false
    note: probe round 1 (2026-08-10) got 401 for both intuitcareers and
      IntuitExternalCareerSite on wd1 — authenticated tenant, not a wrong site
      name. Find the real host/site from a jobs link on intuit.com/careers
      before guessing again.
  - name: PayPal
    tier: A
    category: bigtech
    ats: workday
    workday_host: paypal.wd1.myworkdayjobs.com
    workday_tenant: paypal
    workday_site: jobs
    enabled: true
    note: cxs verified by probe round 1 on 2026-08-10 (200, inventory 110).
      That inventory is small for PayPal — if the board looks thin, check
      whether this site holds only part of their req population.
  - name: Airbnb
    tier: A
    category: bigtech
    ats: greenhouse
    greenhouse_board: airbnb
    enabled: true
    note: verified by probe round 1 on 2026-08-10 (200, 181 jobs on the board).
      Greenhouse returns the whole board and we filter client-side, so one
      request covers every query — see queries_for() in main.py.
  - name: Pinterest
    tier: A
    category: bigtech
    ats: greenhouse
    greenhouse_board: pinterest
    enabled: true
    note: verified by probe round 1 on 2026-08-10 (200, 218 jobs).
  - name: Stripe
    tier: A
    category: bigtech
    ats: greenhouse
    greenhouse_board: stripe
    enabled: true
    note: verified by probe round 1 on 2026-08-10 (200, 557 jobs).
  - name: Datadog
    tier: A
    category: bigtech
    ats: greenhouse
    greenhouse_board: datadog
    enabled: true
    note: verified by probe round 1 on 2026-08-10 (200, 445 jobs).
      NYC-headquartered, so a high share of its finance org is in scope.
  - name: DoorDash
    tier: A
    category: bigtech
    ats: greenhouse
    greenhouse_board: doordashusa
    enabled: true
    note: the board token is "doordashusa", not "doordash" — probe round 4
      (2026-08-11) verified it at 467 jobs while plain "doordash",
      "doordashcareers" and "doordashinc" all 404. Round 1's 404 was a wrong
      guess, not a company that had left Greenhouse; careersatdoordash.com
      itself 403s bots, so the board API is the only way in.

  # ---------------- Tier A / needs a custom adapter ----------------
  # Deliberately deferred from v1 (owner's call: ship a thin board fast rather
  # than spend the day on eight bespoke endpoints). Each needs its own adapter,
  # not a config guess. They stay on the roster so the dashboard shows the gap.
  - name: Apple
    tier: A
    category: bigtech
    ats: generic_page
    url: https://jobs.apple.com/en-us/search
    enabled: false
    note: needs a custom adapter — jobs.apple.com posts to its own
      search-reference API (csrf token required). Not a Workday/Greenhouse shape.
  - name: Microsoft
    tier: A
    category: bigtech
    ats: eightfold
    eightfold_host: jobs.careers.microsoft.com
    eightfold_domain: microsoft.com
    job_url_template: https://jobs.careers.microsoft.com/global/en/job/{id}
    enabled: false
    note: >-
      Microsoft runs Eightfold, found sideways in probe round 5 — its documented
      gcsservices.careers.microsoft.com API fails TLS from the Actions runner
      (SSLError on every attempt), but the jobs host served an Eightfold app
      shell. Round 6 ran the adapter end-to-end and it returned ok=False for
      both queries, so the domain/path guess is still wrong — do not enable on
      the strength of the app shell alone.
  - name: Netflix
    tier: A
    category: bigtech
    ats: eightfold
    eightfold_host: explore.jobs.netflix.net
    eightfold_domain: netflix.com
    job_url_template: https://explore.jobs.netflix.net/careers/job/{id}
    enabled: true
    note: >-
      Eightfold, verified in probe round 4 (count=16 for a finance query) and
      its payload mapped in round 5: the list endpoint returns an EMPTY
      job_description, so the adapter must fetch the per-job detail call — a
      list-only implementation would have shipped every Netflix role with no
      text to score. Round 6 ran the real adapter end-to-end: inventory 485,
      full descriptions on every record. Expect most hits to be Los Angeles or
      overseas — the location gate drops them, which is correct, not breakage.
  - name: Uber
    tier: A
    category: bigtech
    ats: generic_page
    url: https://www.uber.com/us/en/careers/list/
    enabled: false
    note: needs a custom adapter — uber.com/api/loadSearchJobsResults (POST).
  - name: Spotify
    tier: A
    category: bigtech
    ats: generic_page
    url: https://www.lifeatspotify.com/jobs
    enabled: false
    note: needs a custom adapter — lifeatspotify.com/api/jobs. Probe round 1
      also ruled out a "spotify" Greenhouse board (404).
  - name: LinkedIn
    tier: A
    category: bigtech
    ats: generic_page
    url: https://www.linkedin.com/company/linkedin/jobs/
    enabled: false
    note: careers.linkedin.com only. NOT to be scraped via linkedin.com job
      search — see CLAUDE.md rule 3 (account-ban risk). Leave disabled unless a
      non-LinkedIn-domain endpoint is found.
  - name: Block
    tier: A
    category: bigtech
    ats: greenhouse
    greenhouse_board: block
    enabled: true
    note: verified by probe round 1 on 2026-08-10 (200, 190 jobs) — the
      "block" Greenhouse board token is live, so no custom adapter needed.

  # ---------------- Tier B / large tech & enterprise ----------------
  - name: Oracle
    tier: B
    category: tech
    ats: oracle_orc
    url: https://eeho.fa.us2.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions
    site_number: CX_45001
    search_query: "financial planning"
    enabled: true
    note: endpoint reused from unifier-jobs (needs expand=all, limit 100).
      Its keyword match is fuzzy across the whole site, so a single narrower
      search_query beats the default query set here.
  - name: Accenture
    tier: B
    category: advertising
    ats: workday
    workday_host: accenture.wd103.myworkdayjobs.com
    workday_tenant: accenture
    workday_site: AccentureCareers
    enabled: true
    note: reused from unifier-jobs. Their cxs endpoint is intermittently flaky
      (returns HTML instead of JSON some hours) — treat fail_streaks of 3 or
      fewer as flakiness, not breakage. Categorised advertising because
      Accenture Song is the owner's adjacent-industry route, but its corporate
      finance org is the actual target here.

  # ---------------- Advertising / communications holdcos ----------------
  # WARNING (owner's spec): these are the most likely source of roles that
  # REPLICATE the owner's current job. keywords.yaml `exclude.title_terms`
  # drops client/commercial finance titles outright, and body_demote pulls
  # down anything that leans agency-side. Expect low yield per endpoint.
  - name: Publicis Groupe
    tier: C
    category: advertising
    ats: smartrecruiters
    smartrecruiters_company: PublicisGroupe
    enabled: false
    note: >-
      probe round 1 (2026-08-10): the postings API answers 200 with
      totalFound=0 for PublicisGroupe, Publicis, Havas and dentsu alike, so a
      200 here does not mean the token is right — an unknown company returns an
      empty result, not a 404. Read the real token off a live SmartRecruiters
      apply URL before enabling. The adapter itself is proven (built for
      Turner & Townsend in unifier-jobs).
  - name: WPP
    tier: C
    category: advertising
    ats: generic_page
    url: https://www.wpp.com/careers
    enabled: false
    note: holdco careers page is a brochure. WPP hires through its operating
      companies (GroupM, Ogilvy, VML, Hogarth, Burson), each with its own ATS —
      so this is 5+ endpoints, not one. Deferred; expand only if the board is thin.
  - name: Omnicom
    tier: C
    category: advertising
    ats: generic_page
    url: https://www.omnicomgroup.com/careers/
    enabled: false
    note: same fragmentation as WPP (BBDO, DDB, OMD, Annalect each separate).
  - name: Dentsu
    tier: C
    category: advertising
    ats: workday
    workday_host: dentsuaegis.wd3.myworkdayjobs.com
    workday_tenant: dentsuaegis
    workday_site: DAN_GLOBAL
    enabled: true
    note: >-
      Workday tenant dentsuaegis, site DAN_GLOBAL — read off the real handoff
      link on dentsu.com/careers in probe round 5 after seven guessed site names
      all returned 400. Lesson: get the site name from the page, don't guess it.
      Round 6 verified end-to-end: inventory 900, and it surfaced a
      "Manager, FP&A" and a "Financial Reporting Director" in New York. This is
      also the roster's biggest source of client/commercial-finance noise, which
      is exactly what exclude.title_terms is for.
  - name: Havas
    tier: C
    category: advertising
    ats: generic_page
    url: https://havas.com/careers/
    enabled: false
    note: ATS unidentified — sweep for ATS markers first.
